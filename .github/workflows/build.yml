name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Cancela builds antigos da mesma branch quando você faz um push novo
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Se travar, falha em 25 min em vez de ficar rodando
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Localizar o projeto (pasta com build.gradle)
        id: proj
        run: |
          DIR=$(dirname "$(find . -name build.gradle -not -path './.git/*' | head -n 1)")
          echo "Projeto em: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Sem gradle wrapper no projeto, usa o Gradle 8.8 (Loom 1.6 exige 8.6+).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ hashFiles('**/gradlew') == '' && '8.8' || '' }}
          # Só a branch principal grava cache; as demais só leem (upload do cache do Loom é lento)
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --stacktrace
          else
            gradle build --stacktrace
          fi

      - name: Verificar o jar
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "Jar: $JAR ($(stat -c%s "$JAR") bytes)"
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q 'fabric.mod.json' || { echo "ERRO: sem fabric.mod.json"; exit 1; }
          unzip -l "$JAR" | grep -q 'com/example/vigicam/VigiCam.class' || { echo "ERRO: sem classes compiladas"; exit 1; }

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: vigicam
          path: |
            ${{ steps.proj.outputs.dir }}/build/libs/*.jar
            !${{ steps.proj.outputs.dir }}/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.proj.outputs.dir }}/build/libs/*.jar
            !${{ steps.proj.outputs.dir }}/build/libs/*-sources.jar
