# Loom precisa de mais memória pra remapear o Minecraft; com 1G o Gradle fica
# preso em garbage collection e o build demora 10-20+ min.
org.gradle.jvmargs=-Xmx3G -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.15.11
fabric_version=0.92.2+1.20.1
mod_version=1.0.0
maven_group=com.example
archives_base_name=vigicam
